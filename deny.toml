[graph]
# Only check host-compilable crates; skip WASM-only crates.
exclude = ["cesauth-adapter-cloudflare", "cesauth-backend"]

[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2026-0387 — see `.cargo/audit.toml` for the full justification
# and revisit trigger (RFC 141 C1-141). Summary: timing variability in
# crypto-bigint 0.5.5 (via p256/ecdsa/elliptic-curve); cesauth's only
# path into that stack (webauthn/cose.rs, signature verification) never
# carries secret material, so the side channel this advisory describes
# has nothing to leak here.
ignore = ["RUSTSEC-2026-0387"]

[licenses]
version = 2
# Allow widely-used permissive licenses.
allow = [
    "Apache-2.0",
    "MIT",
    "MIT-0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Unlicense",
    "OpenSSL",
    "Zlib",
]
exceptions = []

[bans]
# Deny duplicate versions of security-sensitive crates.
deny = []
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = false
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
