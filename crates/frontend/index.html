<!DOCTYPE html>
<!--
  Trunk shell template for `crates/frontend`.

  In PRODUCTION this file is NOT served directly.  Trunk uses it
  only as the build template; the resulting assets (frontend.js +
  frontend_bg.wasm) are served by the cesauth-backend Worker via
  Workers Static Assets.  The HTML shell served to browsers is
  rendered by crates/backend/src/routes/leptos_shell.rs.

  In LOCAL DEV (`trunk serve`) this is the page Trunk serves on its
  own port (usually 8080) so you can iterate on frontend components
  without starting wrangler.  It is intentionally minimal — the real
  authentication routes are on the wrangler dev port (8787).

  The `<link data-trunk rel="rust"/>` tag is the Trunk directive that:
  - Compiles crates/frontend with --features csr (via data-cargo-features
    below — RFC 127 R4: this was previously missing, so Trunk built with
    default features only, and `app`/`pages`/`leptos_start` — all
    #[cfg(feature = "csr")] — were compiled out. The bundle had no
    wasm_bindgen(start) export.)
  - Injects the generated <script type="module"> that loads the WASM
  - Does NOT run wasm-opt (data-wasm-opt="0", RFC 130 S1). rustc's
    wasm32-unknown-unknown target now emits bulk-memory instructions by
    default; Trunk's own wasm-opt invocation cannot pass the
    --enable-bulk-memory flags accepting them requires (M1 measured this
    holds even on the newest available Binaryen release, not just the
    pinned one), and has no HTML attribute to add them. `make
    build-frontend` runs the real optimization pass itself afterward,
    with the required flags, over whatever Trunk staged — see Makefile.
    A bare `trunk build --release` (skipping the Makefile) still exits 0,
    but ships an unoptimized, un-filehashed-per-CLI-flag bundle; use
    `make build-frontend` for anything that will actually be deployed.
-->
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>cesauth (dev)</title>
  <!-- Trunk injects the compiled WASM bootstrap script here. -->
  <!-- wasm-opt disabled here; make build-frontend runs it manually (see above). -->
  <link data-trunk rel="rust" data-cargo-features="csr" data-wasm-opt="0"/>
</head>
<body>
  <!--
    Mount point.  Leptos mounts the App component into this div.
    The backend's HTML shell (leptos_shell.rs) provides the same
    div in production.
  -->
  <div id="root"></div>
  <noscript>
    <p>This application requires JavaScript and WebAssembly.</p>
  </noscript>
</body>
</html>
