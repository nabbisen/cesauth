[package]
name    = "cesauth-migrate-test"
version                 = { workspace = true }
# Not published to crates.io. Only the name `cesauth` is reserved
# (0.0.0 placeholder, 2026-09-10). Flip this to `true` deliberately,
# per crate, if this one is ever genuinely published -- never by
# leaving it unset. See docs/src/expert/contributing.md.
publish     = false
edition                 = { workspace = true }
license                 = { workspace = true }
authors                 = { workspace = true }

# This crate has no library code; it is purely an integration-test host.
# It uses rusqlite (bundled SQLite) to apply the migration chain against
# an in-memory database and assert structural invariants.

[dev-dependencies]
rusqlite                    = { version = "0.32", features = ["bundled"] }
cesauth-core                = { workspace = true }
