[package]
name        = "cesauth-migrate"
description = "Server-to-server data migration tool for cesauth (ADR-005)."
version.workspace       = true
# Not published to crates.io. Only the name `cesauth` is reserved
# (0.0.0 placeholder, 2026-09-10). Flip this to `true` deliberately,
# per crate, if this one is ever genuinely published -- never by
# leaving it unset. See docs/src/expert/contributing.md.
publish     = false
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true

[[bin]]
name = "cesauth-migrate"
path = "src/main.rs"

[dependencies]
cesauth-core                = { workspace = true }

clap                        = { workspace = true }
serde                       = { workspace = true }
serde_json                  = { workspace = true }
tokio                       = { workspace = true }
anyhow                      = { workspace = true }
