[package]
name        = "cesauth-adapter-cloudflare"
description = "Cloudflare adapter (Durable Objects, D1, KV, R2) for cesauth."
version.workspace       = true
# Not published to crates.io. Only the name `cesauth` is reserved
# (0.0.0 placeholder, 2026-09-10). Flip this to `true` deliberately,
# per crate, if this one is ever genuinely published -- never by
# leaving it unset. See docs/src/expert/contributing.md.
publish     = false
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true

[lib]
# Short, unambiguous import name: `use cesauth_cf::...`.
name = "cesauth_cf"
path = "src/lib.rs"

[dev-dependencies]
# RFC 136 D5: `mailer/unconfigured.rs` has used `#[tokio::test]` since it
# was written, with no `tokio` dev-dependency to provide it — so the test
# target failed to compile and the crate's tests never ran. Same
# declaration as cesauth-adapter-test and cesauth-core use.
tokio                       = { version = "1", features = ["macros", "rt"] }

[dependencies]
cesauth-core                = { workspace = true }

worker                      = { workspace = true }
# Required explicitly since workers-rs 0.8 no longer re-exports these.
wasm-bindgen                = { workspace = true }
js-sys                      = { workspace = true }
serde                       = { workspace = true }
serde_json                  = { workspace = true }
sha2                        = { workspace = true }
thiserror                   = { workspace = true }
time                        = { workspace = true }
uuid                        = { workspace = true }
