name: Clippy lint

# RFC 125: Deny clippy::correctness lints on host-compilable crates.
# Style-level clippy is advisory (RFC 125 D4); correctness lints are
# defects, not style, and remain blocking.
# RFC 138 C1-138: adapter-cloudflare and backend are included. The earlier
# exclusion assumed they need the wasm32 target; both lint on the host with
# zero correctness errors (measured by the RFC 138 review and in C1-138).
#
# RFC 130 M2/M2b: toolchain pinned via dtolnay/rust-toolchain, replacing
# the apt-based install below — apt does not carry arbitrary Rust patch
# releases, so it could never actually track a specific pin. The version
# must match rust-toolchain.toml (repo root) exactly; if you bump one,
# bump both and every other workflow listed in that file's header
# comment, then re-run the full gate set before merging.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Clippy — host crates
        run: |
          cargo clippy \
            -p cesauth-core \
            -p cesauth-adapter-test \
            -p cesauth-frontend \
            -p cesauth-migrate-test \
            -p cesauth-backend \
            -p cesauth-adapter-cloudflare \
            --all-targets \
            -- -D clippy::correctness
