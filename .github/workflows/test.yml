name: Host tests

# RFC 035: Run all host-compilable tests on every PR.
# Excludes cesauth-adapter-cloudflare and cesauth-backend which require
# the wasm32-unknown-unknown target and worker-build toolchain.
#
# RFC 130 M2/M2b: toolchain pinned via dtolnay/rust-toolchain, replacing
# the apt-based install below — apt does not carry arbitrary Rust patch
# releases, so it could never actually track a specific pin. The version
# must match rust-toolchain.toml (repo root) exactly; if you bump one,
# bump both and every other workflow listed in that file's header
# comment, then re-run the full gate set before merging.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown

      - name: Run host crate tests
        run: |
          cargo test -p cesauth-core \
                     -p cesauth-adapter-test \
                     -p cesauth-frontend \
                     --lib

      - name: Run migration integration tests
        run: |
          cargo test -p cesauth-migrate-test --test migration_chain
