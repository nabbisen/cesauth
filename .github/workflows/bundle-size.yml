name: Worker bundle size budget

# RFC 025: Fail CI if the Workers bundle gzip size exceeds the declared
# budget. This catches dependency additions and feature growth before
# they reach a Cloudflare deploy that silently truncates the bundle.
#
# RFC 130 M2b: toolchain version below must match rust-toolchain.toml
# (repo root) and every other workflow listed in that file's header
# comment.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown

      # RFC 142: `wrangler deploy --dry-run` validates `[assets] directory`
      # (crates/frontend/dist), which is a build product and not in the
      # checkout, so on a clean runner this job failed at the next step with
      # "The directory specified by the assets.directory field ... does not
      # exist" on every run. Same two steps, same pin, as worker-build.yml.
      - name: Install Trunk
        run: cargo install trunk --version 0.21.14 --locked

      - name: make build-frontend
        run: make build-frontend

      # worker-build is installed by wrangler.toml's own [build] command,
      # pinned there (RFC 131 C1-131) so every invocation of `wrangler
      # dev`/`build`/`deploy` -- here and everywhere else -- gets the
      # same verified version. Do not install it separately here; a
      # second, unpinned `cargo install worker-build` in this step would
      # be exactly the drift C1-131 exists to close, even though the
      # deploy step below would still end up using the pinned one (its
      # own [build] command reinstalls it immediately before running).
      # RFC 138 D2/D4 (§11.8): an exact action version AND an explicit
      # wranglerVersion. This action installs and runs wrangler, whose version
      # decides the bundle this gate measures, so neither may float. @v3
      # resolved to v3.15.0 on 2026-09-15 (git ls-remote); 4.131.2 is the
      # version the root package.json pins (see DEPENDENCIES.md). v4.0.0 of
      # the action exists; moving to it is a major upgrade outside RFC 138.
      - uses: cloudflare/wrangler-action@v3.15.0
        with:
          wranglerVersion: '4.131.2'
          # --dry-run builds the bundle locally without uploading.
          # No API_TOKEN is needed.
          command: deploy --dry-run --outdir bundled/

      - name: Check bundle gzip size against budget
        run: |
          set -euo pipefail
          bundle="$(find bundled/ -name '*.js' -size +0 -print -quit)"
          if [ -z "$bundle" ]; then
            echo "Error: no .js file found in bundled/" >&2
            exit 1
          fi
          gz_size=$(gzip -c "$bundle" | wc -c)

          # Budget = 2.5 MiB (2621440 bytes).
          # Rationale: Free-plan gzip ceiling is 3 MiB; we keep 500 KiB
          # headroom so a feature release doesn't immediately trip the
          # Free-plan limit.  Paid-plan ceiling is 10 MiB.
          # Update this value in BUNDLE_SIZE_BUDGET.md when intentionally
          # raising it; the CI gate is a deliberate speed-bump, not a
          # gotcha.  See RFC 025 §"Step 1".
          BUDGET=2621440

          echo "Bundle: $bundle"
          echo "Gzip size:  $gz_size bytes"
          echo "Budget:     $BUDGET bytes"
          echo "Usage:      $(( gz_size * 100 / BUDGET ))%"

          if [ "$gz_size" -gt "$BUDGET" ]; then
            echo ""
            echo "❌  Bundle gzip size $gz_size exceeds budget $BUDGET bytes." >&2
            echo "    See BUNDLE_SIZE_BUDGET.md for how to investigate and" >&2
            echo "    how to raise the budget intentionally." >&2
            exit 1
          fi
          echo "✅  Bundle within budget."

      - name: Upload bundle artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: worker-bundle
          path: bundled/
          retention-days: 30
