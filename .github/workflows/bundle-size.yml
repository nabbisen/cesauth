name: Worker bundle size budget

# RFC 025: Fail CI if the Workers bundle gzip size exceeds the declared
# budget. This catches dependency additions and feature growth before
# they reach a Cloudflare deploy that silently truncates the bundle.
#
# RFC 130 M2b: toolchain version below must match rust-toolchain.toml
# (repo root) and every other workflow listed in that file's header
# comment.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown

      # RFC 142: `wrangler deploy --dry-run` validates `[assets] directory`
      # (crates/frontend/dist), which is a build product and not in the
      # checkout, so on a clean runner this job failed at the next step with
      # "The directory specified by the assets.directory field ... does not
      # exist" on every run. Same two steps, same pin, as worker-build.yml.
      - name: Install Trunk
        run: cargo install trunk --version 0.21.14 --locked

      - name: make build-frontend
        run: make build-frontend

      # worker-build is installed by wrangler.toml's own [build] command,
      # pinned there (RFC 131 C1-131) so every invocation of `wrangler
      # dev`/`build`/`deploy` -- here and everywhere else -- gets the
      # same verified version. Do not install it separately here; a
      # second, unpinned `cargo install worker-build` in this step would
      # be exactly the drift C1-131 exists to close, even though the
      # deploy step below would still end up using the pinned one (its
      # own [build] command reinstalls it immediately before running).
      # RFC 138 D2/D4 (§11.8): an exact action version AND an explicit
      # wranglerVersion. This action installs and runs wrangler, whose version
      # decides the bundle this gate measures, so neither may float. @v3
      # resolved to v3.15.0 on 2026-09-15 (git ls-remote); 4.131.2 is the
      # version the root package.json pins (see DEPENDENCIES.md). v4.0.0 of
      # the action exists; moving to it is a major upgrade outside RFC 138.
      - uses: cloudflare/wrangler-action@v3.15.0
        with:
          wranglerVersion: '4.131.2'
          # --dry-run builds the bundle locally without uploading.
          # No API_TOKEN is needed.
          command: deploy --dry-run --outdir bundled/

      - name: Check bundle gzip size against budget
        run: |
          set -euo pipefail
          # RFC 142: measure every module the Worker uploads, not the first
          # `.js` found. `find ... -print -quit` returned bundled/shim.js (a
          # ~10 KB loader) and the ~2 MB `*_bg.wasm` beside it was never
          # measured, so this gate printed "Usage: 0%" on every run it could
          # reach. Source maps and the README are not uploaded modules.
          mapfile -t modules < <(find bundled/ -type f \( -name '*.js' -o -name '*.wasm' \) -size +0 | sort)
          if [ "${#modules[@]}" -eq 0 ]; then
            echo "Error: no .js or .wasm module found in bundled/" >&2
            exit 1
          fi
          if ! printf '%s\n' "${modules[@]}" | grep -q '\.wasm$'; then
            echo "Error: bundled/ holds no .wasm module, and the Worker's code is one; refusing to measure the loader alone" >&2
            exit 1
          fi
          gz_size=0
          for m in "${modules[@]}"; do
            n=$(gzip -c "$m" | wc -c)
            echo "  $n bytes gzip  $m"
            gz_size=$(( gz_size + n ))
          done
          bundle="${#modules[@]} modules"

          # Budget = 2.5 MiB (2621440 bytes).
          # Rationale: Free-plan gzip ceiling is 3 MiB; we keep 500 KiB
          # headroom so a feature release doesn't immediately trip the
          # Free-plan limit.  Paid-plan ceiling is 10 MiB.
          # Update this value in BUNDLE_SIZE_BUDGET.md when intentionally
          # raising it; the CI gate is a deliberate speed-bump, not a
          # gotcha.  See RFC 025 §"Step 1".
          BUDGET=2621440

          echo "Bundle: $bundle"
          echo "Gzip size:  $gz_size bytes"
          echo "Budget:     $BUDGET bytes"
          echo "Usage:      $(( gz_size * 100 / BUDGET ))%"

          if [ "$gz_size" -gt "$BUDGET" ]; then
            echo ""
            echo "❌  Bundle gzip size $gz_size exceeds budget $BUDGET bytes." >&2
            echo "    See BUNDLE_SIZE_BUDGET.md for how to investigate and" >&2
            echo "    how to raise the budget intentionally." >&2
            exit 1
          fi
          echo "✅  Bundle within budget."

      - name: Upload bundle artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: worker-bundle
          path: bundled/
          retention-days: 30

      # 0.109.0-release-machinery handoff, T5 — answers 0.108.0's own open
      # question (its CHANGELOG entry and this file's history above): the
      # bundle grew +12,841 B for a cut whose visible surface was 11
      # catalog keys and one console section, 8.5x the per-key cost
      # 0.106.0 measured. Attributes that growth to named symbols instead
      # of theorising. **Does not change what is linked** (§7 of the
      # handoff) — this rebuilds `crates/frontend/dist` a SECOND time,
      # AFTER the artifact above is already uploaded, purely to measure;
      # nothing downstream in this job reads `dist/` again, so
      # overwriting it here is safe, and the artifact that was checked
      # and uploaded above is the one that ships.
      #
      # Why a second build, not the shipped one: `[profile.release] strip
      # = true` (root Cargo.toml) removes the wasm "name" custom section
      # before wasm-opt even runs, so twiggy can attribute size only to
      # bare `code[N]`/`data[N]` indices on the artifact this job already
      # built (verified locally: `twiggy top` on the shipped,
      # wasm-opt'd *and* on the pre-wasm-opt artifact both report zero
      # named symbols). `CARGO_PROFILE_RELEASE_STRIP=none` on a fresh
      # build restores the name section without editing the checked-in
      # profile. This measurement build is ~10x larger on disk (the name
      # section itself dominates it) and is never uploaded or deployed.
      #
      # Must build in place, inside the workspace: `crates/frontend/
      # Cargo.toml` inherits `edition` from the workspace root manifest
      # (`workspace.package.edition`), so copying the crate out to a
      # standalone directory breaks `cargo metadata`/`trunk build`
      # ("failed to find a workspace root") — found running this exact
      # step in CI the first time.
      - name: Symbol-level size attribution (twiggy, measurement only)
        run: |
          set -euo pipefail
          # DEPENDENCIES.md pin (added by this handoff).
          cargo install twiggy --version 0.8.0 --locked

          cd crates/frontend
          rm -rf dist
          CARGO_PROFILE_RELEASE_STRIP=none trunk build --release --filehash false

          wasm=$(find dist -maxdepth 1 -name '*_bg.wasm' | head -1)
          if [ -z "$wasm" ]; then
            echo "::error::twiggy measurement build produced no *_bg.wasm" >&2
            exit 1
          fi
          echo "Measuring $wasm (unstripped, pre-wasm-opt — for symbol names only; not the shipped artifact)"
          mkdir -p /tmp/twiggy-report
          twiggy top -n 40 "$wasm" | tee /tmp/twiggy-report/twiggy-top-40.txt

      - name: Upload symbol attribution report
        uses: actions/upload-artifact@v4
        with:
          name: twiggy-top-40
          path: /tmp/twiggy-report/twiggy-top-40.txt
          retention-days: 30
          if-no-files-found: error
