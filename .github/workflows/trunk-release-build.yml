name: Trunk release build

# RFC 130 S3: the gate that would have caught findings 4a and 4b (RFC 127
# review §4) — a real `trunk build --release`, not just `cargo check
# --features csr` (that's csr-bundle-check.yml; it catches compile
# defects but cannot catch wasm-opt validation failures or artifact-name
# drift, because it never invokes Trunk or produces a dist/ directory).
#
# Slower than csr-bundle-check.yml (needs Trunk + a Binaryen download on
# the runner) — this complements that gate, it does not replace it.
#
# Runs the same `make build-frontend` target developers use locally, so
# CI and local dev exercise identical logic (RFC 130's fix for 4a: a
# Makefile-driven wasm-opt step with the flags Trunk's own optimize step
# cannot pass — see Makefile's `wasm-opt-fetch` / `build-frontend`
# targets and their comments for why).
#
# RFC 130 M2b: toolchain version below must match rust-toolchain.toml
# (repo root) and every other workflow listed in that file's header
# comment.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  trunk-release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown

      # RFC 131 C1-R5: Trunk is pinned. `cargo install trunk --locked` was
      # unpinned — `--locked` honours *Trunk's own* lockfile, not a version
      # this repository chose, so every run installed whatever the latest
      # release happened to be. An unpinned build tool is not acceptable
      # here for two measured reasons:
      #
      #   - RFC 130 finding 4a was caused by a Trunk/`wasm-opt` version
      #     difference. An unpinned Trunk in CI is that failure's
      #     recurrence condition.
      #   - RFC 131 C1-131: `worker-build` floated to 0.8.5, which raised a
      #     wasm-bindgen floor and broke the deploy path with no commit to
      #     this repository at all. Same shape, different tool.
      #
      # 0.21.14 is the version measured locally on 2026-09-12, and is also
      # crates.io's `max_stable_version` that day — so this pin changes
      # nothing today and freezes the next release out until someone
      # chooses it. 0.22.0 is in beta; when it goes stable an unpinned
      # install would have taken it silently.
      #
      # Pinned at three sites — here, `worker-build.yml` (both jobs), and
      # `browser-tests.yml`. Recorded in DEPENDENCIES.md; bump all of them
      # together.
      - name: Install Trunk
        run: cargo install trunk --version 0.21.14 --locked

      - name: make build-frontend
        run: make build-frontend

      # RFC 134 C1-134: built files land under dist/assets/, matching
      # leptos_shell.rs's own `/assets/...` request paths (previously
      # they landed at dist/'s root, which Static Assets served
      # unprefixed -- so every asset the shell asked for 404'd).
      - name: Assert dist/assets/ contains the filenames leptos_shell.rs hardcodes
        run: |
          set -euo pipefail
          for f in $(grep -oP '^const LEPTOS_\w+:\s*&str\s*=\s*"\K[^"]+' \
                     crates/backend/src/routes/leptos_shell.rs); do
            test -f "crates/frontend/dist/assets/$f" \
              && echo "OK      $f" \
              || { echo "MISSING $f — leptos_shell.rs's constants no longer match what Trunk emits" >&2; exit 1; }
          done

      # RFC 178 §4: the check above only ever lists the files
      # leptos_shell.rs's own consts name -- none of which is a
      # stylesheet, because nothing in the shell or in Trunk's template
      # (crates/frontend/index.html) asks for one. A gate built only from
      # "what is there" cannot notice "what is not", which is exactly how
      # this project shipped with no CSS at all without any gate saying
      # so. Checked by category, not by name -- naming a specific
      # expected filename would mean deciding how the stylesheet gets
      # wired, which is RFC 178 §3's open question, not this gate's.
      #
      # RFC 178 §4b (2026-11-07) reported this, not enforced, because
      # the gap was believed to be RFC 131 R3's unbuilt presentation
      # wiring. RFC 179 corrected that: the missing CSS was R2a's own
      # unfinished import, nine lines sitting at the same pin R2a
      # already used, not unbuilt design work. RFC 179 §4 imports them
      # (crates/frontend/static/base.css) and §9's acceptance criteria
      # require restoring enforcement here. A MISSING result is a real
      # regression again, not a known, owned gap.
      - name: Assert dist/assets/ contains at least one stylesheet
        run: |
          set -euo pipefail
          if compgen -G "crates/frontend/dist/assets/*.css" > /dev/null; then
            echo "OK      $(ls crates/frontend/dist/assets/*.css)"
          else
            echo "MISSING no .css file in crates/frontend/dist/assets/ -- the end-user SPA ships no stylesheet (RFC 179)." >&2
            exit 1
          fi
