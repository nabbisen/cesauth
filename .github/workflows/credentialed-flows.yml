name: Credentialed flows

# RFC 170 — every other gate in this project runs with no credential and no
# migrated D1 state, so two findings were stuck at `observed` (RFC 000 §22):
# driven once by hand, with a commit, never by a gate that fails when the
# behaviour stops working.
#
#   1. RFC 147's deletion sweep — driven by hand at `b0208ab`.
#   2. RFC 152 half A's admin cookie attributes — no witness on a live
#      response; 29 route-contracts.md rows rest on `SameSite=Strict`
#      holding, unobserved by anything that runs on every push.
#
# This job applies migrations to a local D1, seeds exactly one admin token
# (random, per run, never logged — see the seeding step) and the one
# pending deletion request the sweep assertion needs, then makes exactly
# two assertions, each closing one of the findings above. Both assert
# content and attributes, never a bare status code: `contributing.md`'s
# live-probe ruling (refined at the 0.92.1 cut) is that where two outcomes
# share a status, the status itself is not evidence.
#
# ---------------------------------------------------------------------------
# Scope fence (RFC 170 §7) — read before adding a third assertion.
# ---------------------------------------------------------------------------
# This is NOT a general e2e suite with fixtures everyone extends. It makes
# exactly two assertions, each closing a named, written finding (above). A
# third assertion arrives only when a third finding needs one — and that
# finding's own RFC or handoff should say so, not a convenience add here. If
# you find yourself adding a seed, a helper, or a fixture "for later", that
# is the line this job must not cross.
#
# ---------------------------------------------------------------------------
# The credential (RFC 170 §3): generated inside this job, random, per run.
# Never committed, never put in this file, never echoed, never written to
# an artifact. Only its sha256 goes into `admin_tokens.token_hash` — the
# only form `admin::principal_resolver` reads. Neither assertion step below
# ever prints the token or the admin cookie it becomes (`Set-Cookie:
# __Host-cesauth_admin=<this same token>; ...`) — on failure they print only
# a status line or an attribute *name*, never the header or body that
# carries it. `::add-mask::` is registered immediately after generation as
# defence in depth on top of that: verified against a real run that
# `wrangler dev`'s own console log prints only `METHOD /path STATUS`, never
# the query string, so nothing here currently needs the mask to stay clean
# — but a future wrangler version or a careless debug line could change
# that, and the mask costs nothing to keep.
# ---------------------------------------------------------------------------
#
# RFC 142 M1 (named in advance, RFC 170 §4): build the Worker in its own,
# earlier step, same as `browser-tests.yml` and `worker-build.yml` — a cold
# compile on a clean runner took ~3.5 minutes against a 180s readiness
# deadline, which fails every time if the build runs inside `wrangler dev`'s
# own startup instead. The deadline below is NOT raised to compensate.
#
# RFC 130 M2b: the toolchain version below must match rust-toolchain.toml
# (repo root) and every other workflow listed in that file's header comment.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  credentialed-flows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown

      # `wrangler.toml`'s `[assets] directory = crates/frontend/dist` means
      # `wrangler build` / `wrangler dev` both fail without this, same as
      # worker-build.yml and browser-tests.yml.
      - name: Install Trunk
        run: cargo install trunk --version 0.21.14 --locked

      - name: make build-frontend
        run: make build-frontend

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # RFC 138: the pinned wrangler from the root lockfile. Never `npx`.
      - name: Install pinned wrangler (root npm ci)
        run: npm ci

      # RFC 142 M1 — see the header comment. Built here, in its own step, so
      # a slow or broken build fails here, not inside the readiness deadline
      # below.
      - name: Build the Worker (pinned wrangler)
        run: |
          set -euo pipefail
          test -x node_modules/.bin/wrangler || { echo "::error::wrangler is not installed: run npm ci at the repository root (RFC 138)"; exit 1; }
          node_modules/.bin/wrangler build

      # RFC 170 §2.1 / §9: the pinned wrangler, never a bare `wrangler`
      # (RFC 138). `--persist-to` pins the same local D1 state directory
      # this step, the seeding step, and `wrangler dev` below all share —
      # explicit rather than relying on each command's own default, so
      # there is one answer to "which state did this write to."
      - name: Apply D1 migrations (local)
        run: |
          set -euo pipefail
          node_modules/.bin/wrangler d1 migrations apply cesauth --local --persist-to .wrangler/rfc170-state

      # RFC 170 §3. Seeds only the three rows the two assertions below need:
      # one admin token (hash only), one user, and one already-due pending
      # deletion request for that user. Nothing here is a reusable fixture —
      # see the scope-fence comment at the top of this file.
      - name: Seed one admin token and a due deletion request
        run: |
          set -euo pipefail
          WRANGLER="node_modules/.bin/wrangler"
          DB_ARGS=(cesauth --local --persist-to .wrangler/rfc170-state)

          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::${TOKEN}"
          echo "${TOKEN}" > /tmp/rfc170-admin-token
          HASH="$(printf '%s' "${TOKEN}" | sha256sum | cut -d' ' -f1)"
          NOW="$(date +%s)"

          # role='super' only to satisfy admin_tokens' CHECK constraint —
          # this token exists to reach /admin/login, not to exercise RBAC.
          "$WRANGLER" d1 execute "${DB_ARGS[@]}" --command \
            "INSERT INTO admin_tokens (id, token_hash, role, name, created_at) VALUES ('rfc170-ci-admin', '${HASH}', 'super', 'rfc170-ci', ${NOW})"

          "$WRANGLER" d1 execute "${DB_ARGS[@]}" --command \
            "INSERT INTO users (id, tenant_id, email, email_verified, display_name, account_type, status, created_at, updated_at) VALUES ('rfc170-ci-user', 'tenant-default', 'rfc170-ci@example.invalid', 1, NULL, 'human_user', 'active', ${NOW}, ${NOW})"

          # scheduled_at is in the past, so it is already due when the
          # scheduled handler below runs list_due.
          "$WRANGLER" d1 execute "${DB_ARGS[@]}" --command \
            "INSERT INTO deletion_requests (id, user_id, tenant_id, requested_at, requested_by, reason, scheduled_at, status) VALUES ('rfc170-ci-del', 'rfc170-ci-user', 'tenant-default', $((NOW - 3600)), 'rfc170-ci-user', 'rfc170 ci probe', $((NOW - 60)), 'pending')"

          echo "✅  seeded admin_tokens(name=rfc170-ci), users(rfc170-ci-user), deletion_requests(rfc170-ci-del) — no token value printed above"

      # Started explicitly, not via a test runner's own webServer — a build
      # or startup failure is reported as itself, not as a timeout.
      # --test-scheduled exposes /__scheduled for assertion 1, below.
      - name: Start the Worker (pinned wrangler, --test-scheduled)
        run: |
          set -euo pipefail
          node_modules/.bin/wrangler dev --port 8787 --test-scheduled --persist-to .wrangler/rfc170-state > /tmp/credentialed-flows.log 2>&1 &
          for _ in $(seq 1 90); do
            if curl -sf -o /dev/null http://localhost:8787/login; then
              echo "wrangler dev is serving"
              exit 0
            fi
            sleep 2
          done
          echo "::error::wrangler dev never served /login" >&2
          cat /tmp/credentialed-flows.log >&2
          exit 1

      # RFC 170 §4 / stage 1b's own cold-start precedent: a just-rebuilt
      # worker's first request runs ~24s against a 180s-class deadline.
      # One throwaway request absorbs that before the real assertions.
      - name: Warm-up request
        run: curl -s -o /dev/null http://localhost:8787/login || true

      # ---------------------------------------------------------------------
      # Assertion 1 — RFC 147's deletion sweep. `observed` -> `exercised`.
      # ---------------------------------------------------------------------
      # Asserts three things, not a status code: the user row is gone, the
      # request row reads executed/sweep, and the audit chain carries
      # deletion_executed with subject = the deleted user (RFC 148's scrub
      # outcome rides free in the same row's `reason`).
      - name: Assert the deletion sweep executes (RFC 147 observed -> exercised)
        run: |
          set -euo pipefail
          WRANGLER="node_modules/.bin/wrangler"
          DB_ARGS=(cesauth --local --persist-to .wrangler/rfc170-state)

          curl -sf -o /dev/null "http://localhost:8787/__scheduled?cron=0+4+*+*+*"
          sleep 2

          USER_N="$("$WRANGLER" d1 execute "${DB_ARGS[@]}" --json --command \
            "SELECT count(*) as n FROM users WHERE id='rfc170-ci-user'" | jq -r '.[0].results[0].n')"
          if [ "$USER_N" != "0" ]; then
            echo "::error::seeded user row survived the sweep (count=$USER_N)" >&2
            exit 1
          fi

          REQ_JSON="$("$WRANGLER" d1 execute "${DB_ARGS[@]}" --json --command \
            "SELECT status, executed_by FROM deletion_requests WHERE id='rfc170-ci-del'")"
          REQ_STATUS="$(printf '%s' "$REQ_JSON" | jq -r '.[0].results[0].status // "absent"')"
          REQ_BY="$(printf '%s' "$REQ_JSON" | jq -r '.[0].results[0].executed_by // "absent"')"
          if [ "$REQ_STATUS" != "executed" ] || [ "$REQ_BY" != "sweep" ]; then
            echo "::error::deletion_requests row did not reach executed/sweep (status=$REQ_STATUS executed_by=$REQ_BY)" >&2
            exit 1
          fi

          AUDIT_JSON="$("$WRANGLER" d1 execute "${DB_ARGS[@]}" --json --command \
            "SELECT kind, subject, reason FROM audit_events WHERE kind='deletion_executed' AND subject='rfc170-ci-user' ORDER BY seq DESC LIMIT 1")"
          AUDIT_KIND="$(printf '%s' "$AUDIT_JSON" | jq -r '.[0].results[0].kind // "absent"')"
          AUDIT_REASON="$(printf '%s' "$AUDIT_JSON" | jq -r '.[0].results[0].reason // "absent"')"
          if [ "$AUDIT_KIND" != "deletion_executed" ]; then
            echo "::error::no deletion_executed audit event with subject=rfc170-ci-user" >&2
            exit 1
          fi

          echo "✅  user row gone; deletion_requests reads executed/sweep; audit carries deletion_executed subject=rfc170-ci-user reason=\"$AUDIT_REASON\""

      # ---------------------------------------------------------------------
      # Assertion 2 — RFC 152 half A's admin cookie, restored as a witness.
      # ---------------------------------------------------------------------
      # Walks the real two-step flow: GET validates the token and renders
      # the confirmation page (which carries a CSRF cookie + matching form
      # field); POST verifies that CSRF token and sets the admin cookie.
      # The POST's admin cookie carries the same raw token as its value, so
      # this script never prints it: on failure it reports only a status
      # line or an attribute *name*, never the `Set-Cookie` header itself.
      - name: Walk /admin/login and assert the admin cookie's attributes
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/rfc170-admin-token)"

          GET_RESP="$(curl -si "http://localhost:8787/admin/login?token=${TOKEN}")"
          printf '%s' "$GET_RESP" | head -1 | grep -q ' 200 ' || {
            echo "::error::GET /admin/login did not return 200 for the seeded token" >&2
            printf '%s\n' "$GET_RESP" | head -1 >&2
            exit 1
          }

          CSRF_LINE="$(printf '%s' "$GET_RESP" | grep -i '^set-cookie:' | grep 'cesauth-csrf' || true)"
          CSRF_VALUE="$(printf '%s' "$CSRF_LINE" | sed -E 's/^[Ss]et-[Cc]ookie: *//; s/;.*//; s/^__Host-cesauth-csrf=//' | tr -d '\r')"
          if [ -z "$CSRF_VALUE" ]; then
            echo "::error::GET /admin/login's confirmation page carried no CSRF cookie" >&2
            exit 1
          fi

          POST_RESP="$(curl -si -X POST "http://localhost:8787/admin/login" \
            -H "Cookie: __Host-cesauth-csrf=${CSRF_VALUE}" \
            --data-urlencode "token=${TOKEN}" \
            --data-urlencode "csrf=${CSRF_VALUE}")"

          ADMIN_COOKIE="$(printf '%s' "$POST_RESP" | grep -i '^set-cookie:' | grep '__Host-cesauth_admin' || true)"
          if [ -z "$ADMIN_COOKIE" ]; then
            echo "::error::POST /admin/login never set the __Host-cesauth_admin cookie" >&2
            printf '%s\n' "$POST_RESP" | head -1 >&2
            exit 1
          fi

          fail=0
          for attr in '__Host-cesauth_admin=' 'Path=/' 'HttpOnly' 'Secure' 'SameSite=Strict'; do
            if ! printf '%s' "$ADMIN_COOKIE" | grep -qF "$attr"; then
              echo "::error::admin cookie is missing '$attr' (value withheld from the log)" >&2
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

          echo "✅  admin cookie carries __Host-, Path=/, HttpOnly, Secure, SameSite=Strict (value withheld from the log)"

      - name: Worker dev-server log
        if: always()
        run: cat /tmp/credentialed-flows.log
