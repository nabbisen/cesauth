name: Browser tests

# RFC 131 R5e — cesauth's first browser gate.
#
# What this adds that nothing else can: `runtime-smoke-check.sh` asserts via
# curl that `/` and `/login` return 200 HTML with a CSP header and that every
# referenced asset resolves. All of that was true throughout the RFC 135
# outage, when both pages rendered blank because the CSP forbade WebAssembly
# compilation. Only a browser decides whether the bundle instantiates and
# Leptos mounts. This job is that browser.
#
# ---------------------------------------------------------------------------
# BLOCKING as of 0.84.0 (RFC 131 R5f). It was non-blocking for exactly one
# release, 0.83.0, to tell first-contact flakes from findings; it produced
# none.
# ---------------------------------------------------------------------------
# Blocking is a branch-protection setting, not a property of this file: it
# means "browser-tests" is a required status check. As of 2026-09-23 (RFC 142)
# that setting IS NOT IN PLACE: `main` is unprotected and no check is required,
# so nothing is blocked. Nothing here enforces it, and nothing here can.
#
# It is deliberately NOT `continue-on-error: true`, and must never become so:
# that would make the job report success while failing, which is worse than a
# non-required check, because the red is invisible too.
#
# **The standing rule from here on: a flake is diagnosed and fixed, or the
# test is deleted. The gate is not made non-blocking again.** An indefinitely
# non-blocking gate is decoration.
#
# Scope: public, unauthenticated pages only (handoff §7) — `/` and `/login`,
# which are the only routes in route-contracts.md whose actor is `Anonymous`.
# A gate that needs a session gets disabled the first time session handling
# changes. Authenticated screens arrive with RFC 131 R3.
#
# RFC 130 M2b: the toolchain version below must match rust-toolchain.toml
# (repo root) and every other workflow listed in that file's header comment.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown

      # `make build-frontend` invokes `trunk` directly (see the Makefile), so
      # it must be installed explicitly — as trunk-release-build.yml does.
      # Pinned (RFC 131 C1-R5): `--locked` alone honours Trunk's own
      # lockfile, not a version this repository chose. Rationale, and the
      # other two pin sites, in trunk-release-build.yml.
      - name: Install Trunk
        run: cargo install trunk --version 0.21.14 --locked

      - name: make build-frontend
        run: make build-frontend

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `npm ci` installs exactly the committed lockfile — the pinned
      # @playwright/test and axe-playwright versions, never "latest"
      # (handoff §9).
      - name: Install harness dependencies
        working-directory: e2e
        run: npm ci

      # Playwright's own pinned browser revision for the pinned Playwright
      # version. `--with-deps` adds the system libraries headless Chromium
      # needs on a bare runner.
      - name: Install Chromium (Playwright's pinned revision)
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # RFC 138: the root install providing node_modules/.bin/wrangler, which
      # the next step runs. The e2e `npm ci` above installs only e2e/'s tree.
      - name: Install pinned wrangler (root npm ci)
        run: npm ci

      # RFC 142: build the Worker HERE, in its own step, so that `wrangler dev`
      # below starts against a warm target/ and only has to re-run worker-build's
      # post-processing. `wrangler dev` runs wrangler.toml's `[build]` command
      # itself, cold, and on a clean runner that first compile took ~3.5 minutes
      # against a readiness deadline of 180 seconds, so this gate failed on every run
      # (RFC 142 M1). The deadline is deliberately NOT raised: a longer wait
      # would hide a build that is slow, and the build has its own step to
      # be slow, and to fail, in.
      - name: Build the Worker (pinned wrangler)
        run: |
          set -euo pipefail
          test -x node_modules/.bin/wrangler || { echo "::error::wrangler is not installed: run npm ci at the repository root (RFC 138)"; exit 1; }
          node_modules/.bin/wrangler build

      # Started explicitly rather than via Playwright's `webServer`, so a
      # build or startup failure is reported as itself instead of as a
      # test-runner timeout.
      - name: Start the Worker (pinned wrangler)
        run: |
          set -euo pipefail
          test -x node_modules/.bin/wrangler || { echo "::error::wrangler is not installed: run npm ci at the repository root (RFC 138)"; exit 1; }
          node_modules/.bin/wrangler dev --port 8787 > /tmp/wrangler-dev.log 2>&1 &
          echo $! > /tmp/wrangler.pid
          for _ in $(seq 1 90); do
            if curl -sf -o /dev/null http://localhost:8787/login; then
              echo "wrangler dev is serving"
              exit 0
            fi
            sleep 2
          done
          echo "::error::wrangler dev never served /login" >&2
          cat /tmp/wrangler-dev.log >&2
          exit 1

      - name: Playwright
        working-directory: e2e
        run: npx playwright test

      # The runtime's own output. A browser failure is often explained by
      # something the Worker logged, and the log is gone once the job ends.
      - name: Worker dev-server log
        if: always()
        run: cat /tmp/wrangler-dev.log

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
