name: Cargo deny (licenses & advisories)

# RFC 035: Check for license compliance and security advisories.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Run daily to catch new advisories published since last PR.
    - cron: '0 6 * * *'

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # RFC 138 D4 (§11.8): exact version, not a major tag. This action installs
      # and runs cargo-deny, whose version decides the gate's verdict, so a
      # moving @v2 could change the verdict with no commit here. v2.1.1 is the
      # commit @v2 resolved to on 2026-09-15 (git ls-remote), so this pin
      # changes nothing today.
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          log-level: warn
          command: check
          arguments: --config deny.toml
