name: Worker build

# RFC 131 C1-131: the deploy path was never gated. Every other gate in
# this project checks *compilation* (`cargo check -p cesauth-backend
# --target wasm32-unknown-unknown`); none of them ran `worker-build`,
# which is what `wrangler.toml`'s `[build] command` actually invokes on
# both `wrangler dev` AND `wrangler deploy`. That gap let a
# worker-build/wasm-bindgen version mismatch break the deploy path
# silently: `cargo check` stayed green throughout, because it never
# reaches the wasm-bindgen post-processing step where the break was.
#
# This gate runs `wrangler build`, which invokes wrangler.toml's own
# `[build] command` (installing the pinned worker-build, see that
# file's comment) and then validates bindings and the frontend assets
# directory -- the same thing `wrangler deploy` does, minus the actual
# upload. `--dry-run` is implicit in `build` (it never talks to
# Cloudflare's API), so this needs no credentials and is safe in CI on
# a fork or a PR from an external contributor.
#
# RFC 130 M2b: toolchain version below must match rust-toolchain.toml
# (repo root) and every other workflow listed in that file's header
# comment.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  worker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown

      # RFC 131 C1-R5: `make build-frontend` invokes `trunk` directly
      # (Makefile's build-frontend target) and nothing installs it, so
      # both jobs in this workflow failed at the next step on a clean
      # runner -- meaning neither gate had ever executed. See the pin
      # rationale in trunk-release-build.yml.
      - name: Install Trunk
        run: cargo install trunk --version 0.21.14 --locked

      - name: make build-frontend
        run: make build-frontend

      # RFC 131 C2-131: Trunk always emits dist/index.html, and the
      # Makefile's build-frontend target now deletes it (see that
      # target's comment) because Cloudflare Workers Static Assets was
      # serving it directly at `/` -- ahead of the Worker script, with
      # none of the Worker's security headers applied. This assertion
      # is the invariant that removal exists to guarantee: nothing
      # under the deployed asset directory is HTML. A `.html` file
      # reappearing here (a Trunk upgrade re-adding it under a
      # different name, a future static asset genuinely needing to be
      # HTML) is worth a human decision, not a silent pass.
      - name: Assert no .html in the deployed asset directory
        run: |
          set -euo pipefail
          html_files=$(find crates/frontend/dist -name '*.html')
          if [ -n "$html_files" ]; then
            echo "❌  .html file(s) found in crates/frontend/dist/ -- Cloudflare" >&2
            echo "    Workers Static Assets will serve these ahead of the Worker" >&2
            echo "    script, bypassing routes::ui::login and every security header" >&2
            echo "    it applies (RFC 131 C1-131/C2-131)." >&2
            echo "$html_files" >&2
            exit 1
          fi
          echo "✅  No .html in crates/frontend/dist/"

      - name: wrangler build
        run: npx wrangler build

  runtime-smoke:
    # RFC 134 T3 — the first gate in this project's history to boot the
    # Worker runtime and issue a request. `worker-build` above proves the
    # Worker *builds*; it does not prove the router *constructs* or that
    # a request gets a real response. RFC 134 found the gap the hard way:
    # `worker`'s router panicked on construction, on every request,
    # across eight shipped releases (2026-07-07 through 0.81.3), and
    # nothing in the gate set noticed, because nothing booted the
    # runtime. See scripts/runtime-smoke-check.sh for what this asserts
    # and why (content and headers, never status alone).
    #
    # No Cloudflare credentials needed -- `wrangler dev` runs entirely
    # against Miniflare's local simulation. No `.dev.vars` secrets and
    # no D1 migrations either: measured (RFC 134 T4) that the six checks
    # below don't need them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown

      # RFC 131 C1-R5: `make build-frontend` invokes `trunk` directly
      # (Makefile's build-frontend target) and nothing installs it, so
      # both jobs in this workflow failed at the next step on a clean
      # runner -- meaning neither gate had ever executed. See the pin
      # rationale in trunk-release-build.yml.
      - name: Install Trunk
        run: cargo install trunk --version 0.21.14 --locked

      - name: make build-frontend
        run: make build-frontend

      - name: Runtime smoke check
        run: bash scripts/runtime-smoke-check.sh
